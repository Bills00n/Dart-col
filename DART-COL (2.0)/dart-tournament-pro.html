<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Dart Tournament Pro</title>
    <link rel="icon" type="image/png" href="img/tournament.png?v=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-deep: #020617;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Usunięcie strzałek z pól number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .bento-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn {
            position: relative;
            padding: 0.75rem 1.25rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 4px;
            background: var(--accent);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--accent);
        }

        .input-dart {
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .input-dart:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            outline: none;
        }

        .draggable-name {
            cursor: grab;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            display: block;
            width: 100%;
            min-height: 24px;
        }

        .draggable-name:hover:not(:empty) {
            background: rgba(99, 102, 241, 0.2);
            color: white;
        }

        .draggable-name:empty::before {
            content: 'Puste';
            opacity: 0.2;
            font-style: italic;
        }

        .drop-zone-active {
            background: rgba(99, 102, 241, 0.2) !important;
            border-color: var(--accent) !important;
        }

        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .archive-view {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="selection:bg-indigo-500/30">

    <div class="max-w-7xl mx-auto px-4 py-8 md:py-12">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20 overflow-hidden">
                        <img src="img/tournament.png?v=1" alt="Tournament Logo" class="w-7 h-7 object-contain">
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white" id="mainTitleDisplay">DART<span class="text-indigo-500" id="headerYear">24</span></h1>
                </div>
                <p class="text-slate-400 font-medium tracking-wide" id="subTitleDisplay">Zarządzanie Turniejem</p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
                <button onclick="resetTournament()" class="px-4 py-2 text-xs font-bold bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl hover:bg-red-500/20 transition-all uppercase tracking-widest">
                    Resetuj Dane
                </button>
                <div id="statusIndicator" class="flex items-center gap-3 px-5 py-2.5 rounded-2xl bg-slate-900/50 border border-slate-800 shadow-inner">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="text-sm font-bold text-slate-200 tracking-wide uppercase" id="statusText">Konfiguracja</span>
                </div>
            </div>
        </header>

        <nav class="flex gap-2 mb-10 p-1.5 bg-slate-900/40 border border-white/5 rounded-2xl w-fit overflow-x-auto max-w-full">
            <button onclick="switchTab('setup')" id="tab-setup" class="tab-btn active font-semibold text-sm">Uczestnicy</button>
            <button onclick="switchTab('groups')" id="tab-groups" class="tab-btn text-slate-400 font-semibold text-sm">Faza Grupowa</button>
            <button onclick="switchTab('bracket')" id="tab-bracket" class="tab-btn text-slate-400 font-semibold text-sm">Drabinka</button>
            <button onclick="switchTab('history')" id="tab-history" class="tab-btn text-slate-400 font-semibold text-sm">Archiwum</button>
        </nav>

        <section id="section-setup" class="animate-pop grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bento-card p-8">
                    <h2 class="text-xl font-bold mb-6">Nazwa Turnieju</h2>
                    <input type="text" id="tournamentNameInput" placeholder="" class="w-full input-dart rounded-xl px-4 py-3 text-slate-200 placeholder:text-slate-600 mb-4">
                </div>
                <div class="bento-card p-8">
                    <h2 class="text-xl font-bold mb-6">Dodaj gracza</h2>
                    <div class="space-y-4">
                        <input type="text" id="playerNameInput" onkeydown="handleEnter(event)" placeholder="Imię lub pseudonim" class="w-full input-dart rounded-xl px-4 py-3 text-slate-200 placeholder:text-slate-600">
                        <button onclick="addPlayer()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 active:scale-95">Zarejestruj</button>
                    </div>
                </div>
                <div class="bento-card p-8">
                    <h2 class="text-xl font-bold mb-6">Ustawienia</h2>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-400 mb-3">System rozgrywek</label>
                            <select id="groupCount" class="w-full input-dart rounded-xl px-4 py-3 text-slate-200">
                                <option value="0">Drabinka (bez grup)</option>
                                <option value="2" selected>2 Grupy</option>
                                <option value="3">3 Grupy</option>
                                <option value="4">4 Grupy</option>
                                <option value="5">5 Grupy</option>
                            </select>
                        </div>
                        <button onclick="startTournament()" id="startBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-emerald-600/20 disabled:opacity-30 disabled:cursor-not-allowed">Rozpocznij Turniej</button>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2 bento-card p-8">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-bold">Uczestnicy</h2>
                    <span id="playerCounter" class="bg-indigo-500/10 text-indigo-400 text-xs font-bold px-3 py-1 rounded-full border border-indigo-500/20">0 Graczy</span>
                </div>
                <div id="playerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>

        <section id="section-groups" class="hidden animate-pop space-y-12">
            <div id="groupsContainer" class="grid grid-cols-1 xl:grid-cols-2 gap-8"></div>
            <div class="flex flex-col items-center gap-4 py-12">
                <button onclick="generateBracket()" class="px-12 py-5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-black text-xl rounded-2xl shadow-2xl shadow-indigo-500/30 transition-all hover:-translate-y-1 active:scale-95">Generuj Drabinkę</button>
            </div>
        </section>

        <section id="section-bracket" class="hidden animate-pop">
            <div class="mb-4 p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-center text-sm text-indigo-300">
                💡 Przeciągnij gracza, aby zmienić parę. Puste pola zostaw, jeśli nie ma przeciwnika.
            </div>
            <div class="bento-card p-1 overflow-x-auto min-h-[600px] flex items-center relative">
                <div id="bracketContainer" class="min-w-[1000px] w-full flex justify-between items-stretch py-12 px-8"></div>
                <div id="finishTournamentContainer" class="hidden absolute bottom-8 right-8 animate-bounce">
                    <button onclick="archiveTournament()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold shadow-xl flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Zakończ i Zarchiwizuj Turniej
                    </button>
                </div>
            </div>
        </section>

        <section id="section-history" class="hidden animate-pop">
            <div class="bento-card p-8">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-bold">Archiwum</h2>
                    <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-red-400 uppercase tracking-widest">Wyczyść wszystko</button>
                </div>
                <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </section>
    </div>

    <div id="archiveOverlay" class="fixed inset-0 z-[100] archive-view hidden flex flex-col p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto w-full">
            <div class="flex justify-between items-center mb-12">
                <div>
                    <h2 id="archiveTitle" class="text-4xl font-black text-white">Nazwa</h2>
                    <p id="archiveDate" class="text-slate-400 mt-2 font-medium"></p>
                </div>
                <button onclick="closeArchive()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div id="archiveContent" class="space-y-16 pb-20"></div>
        </div>
    </div>

    <script>
        const currentYear = new Date().getFullYear();
        
        function getCurrentSeason() {
            const month = new Date().getMonth();
            if (month >= 2 && month <= 4) return "Wiosenny";
            if (month >= 5 && month <= 8) return "Letni";
            if (month >= 9 && month <= 10) return "Jesienny";
            return "Zimowy";
        }

        document.getElementById('headerYear').innerText = currentYear.toString().slice(-2);
        document.getElementById('pageTitle').innerText = `Dart Tournament Pro ${currentYear}`;
        document.getElementById('tournamentNameInput').placeholder = `Np. ${getCurrentSeason()} Puchar ${currentYear}`;

        let tournamentName = "";
        let players = [];
        let groups = [];
        let bracketData = [];
        let tournamentHistory = [];
        let currentStatus = "Konfiguracja";

        let draggedPlayer = null;
        let dragSource = null;

        const STORAGE_KEY = 'dart26_v6_final';

        function saveData() {
            const state = { tournamentName, players, groups, bracketData, tournamentHistory, currentStatus };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const state = JSON.parse(saved);
                tournamentName = state.tournamentName || "";
                players = state.players || [];
                groups = state.groups || [];
                bracketData = state.bracketData || [];
                tournamentHistory = state.tournamentHistory || [];
                currentStatus = state.currentStatus || "Konfiguracja";
                document.getElementById('tournamentNameInput').value = tournamentName;
                updateHeader();
                renderPlayerList();
                renderGroups();
                renderBracket();
                renderHistory();
            }
        }

        function updateHeader() {
            const main = document.getElementById('mainTitleDisplay');
            if (tournamentName) {
                main.innerHTML = tournamentName.toUpperCase();
            } else {
                main.innerHTML = `DART<span class="text-indigo-500">${currentYear.toString().slice(-2)}</span>`;
            }
            document.getElementById('statusText').innerText = currentStatus;
        }

        function resetTournament() {
            if (confirm("Reset obecnego turnieju?")) {
                tournamentName = ""; players = []; groups = []; bracketData = []; currentStatus = "Konfiguracja";
                saveData(); location.reload();
            }
        }

        function switchTab(tabId) {
            ['setup', 'groups', 'bracket', 'history'].forEach(id => {
                const sec = document.getElementById(`section-${id}`);
                const tab = document.getElementById(`tab-${id}`);
                if(sec) sec.classList.add('hidden');
                if(tab) tab.classList.remove('active', 'text-slate-400');
                if (id !== tabId && tab) tab.classList.add('text-slate-400');
            });
            const activeSec = document.getElementById(`section-${tabId}`);
            const activeTab = document.getElementById(`tab-${tabId}`);
            if(activeSec) activeSec.classList.remove('hidden');
            if(activeTab) activeTab.classList.add('active');
        }

        function handleEnter(e) { if (e.key === 'Enter') addPlayer(); }

        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if (!name) return;
            players.push({ id: Date.now() + Math.random(), name });
            input.value = '';
            renderPlayerList(); saveData();
        }

        function removePlayer(id) {
            players = players.filter(p => p.id !== id);
            renderPlayerList(); saveData();
        }

        function renderPlayerList() {
            const container = document.getElementById('playerList');
            document.getElementById('playerCounter').innerText = `${players.length} Graczy`;
            container.innerHTML = players.map(p => `
                <div class="flex justify-between items-center bg-slate-900/40 p-4 rounded-xl border border-white/5">
                    <span class="font-semibold">${p.name}</span>
                    <button onclick="removePlayer(${p.id})" class="text-slate-600 hover:text-red-400">Usuń</button>
                </div>
            `).join('');
            document.getElementById('startBtn').disabled = players.length < 2;
        }

        function startTournament() {
            tournamentName = document.getElementById('tournamentNameInput').value.trim() || `${getCurrentSeason()} Puchar ${currentYear}`;
            const gCount = parseInt(document.getElementById('groupCount').value);
            const shuffled = [...players].sort(() => Math.random() - 0.5);
            
            if (gCount === 0) {
                generateBracket(shuffled);
                return;
            }

            groups = Array.from({ length: gCount }, (_, i) => ({ 
                id: i, name: `Grupa ${String.fromCharCode(65 + i)}`, players: [], matches: [] 
            }));
            shuffled.forEach((p, i) => groups[i % gCount].players.push({...p}));
            groups.forEach(g => {
                for (let i = 0; i < g.players.length; i++) {
                    for (let j = i + 1; j < g.players.length; j++) {
                        g.matches.push({ id: Math.random(), p1: g.players[i], p2: g.players[j], s1: null, s2: null, played: false });
                    }
                }
            });
            currentStatus = "Faza Grupowa"; updateHeader(); renderGroups(); saveData(); switchTab('groups');
        }

        function calculateStandings(group) {
            const s = group.players.map(p => ({ ...p, m: 0, w: 0, pts: 0, bilans: 0, groupId: group.id }));
            group.matches.forEach(m => {
                if (!m.played) return;
                const p1 = s.find(x => x.id === m.p1.id), p2 = s.find(x => x.id === m.p2.id);
                if(!p1 || !p2) return;
                
                p1.m++; p2.m++;
                if (m.s1 > m.s2) { p1.w++; p1.pts += 1; }
                else if (m.s2 > m.s1) { p2.w++; p2.pts += 1; }
                p1.bilans += (m.s1 - m.s2);
                p2.bilans += (m.s2 - m.s1);
            });
            return s.sort((a,b) => b.pts - a.pts || b.bilans - a.bilans || b.w - a.w);
        }

        function generateBracket(customPlayers = null) {
            let initialMatches = [];
            
            if (customPlayers) {
                const size = Math.pow(2, Math.ceil(Math.log2(customPlayers.length)));
                const p = Array.from({ length: size }, (_, i) => customPlayers[i] || { id: `empty-${i}`, name: "", isEmpty: true });
                for (let i = 0; i < p.length; i += 2) {
                    initialMatches.push({ p1: p[i], p2: p[i+1], s1: null, s2: null, winner: null, id: Math.random() });
                }
            } else {
                let firstPlaces = [];
                let secondPlaces = [];
                
                groups.forEach(g => {
                    const st = calculateStandings(g);
                    if (st[0]) firstPlaces.push({ ...st[0] });
                    if (st[1]) secondPlaces.push({ ...st[1] });
                });

                firstPlaces.sort(() => Math.random() - 0.5);
                
                firstPlaces.forEach(p1 => {
                    let validOpponents = secondPlaces.filter(p2 => p2.groupId !== p1.groupId);
                    if (validOpponents.length === 0 && secondPlaces.length > 0) validOpponents = secondPlaces;
                    
                    if (validOpponents.length > 0) {
                        const randomIndex = Math.floor(Math.random() * validOpponents.length);
                        const p2 = validOpponents[randomIndex];
                        initialMatches.push({ p1, p2, s1: null, s2: null, winner: null, id: Math.random() });
                        secondPlaces = secondPlaces.filter(x => x.id !== p2.id);
                    } else {
                        initialMatches.push({ p1, p2: { id: `empty-${p1.id}`, name: "", isEmpty: true }, s1: null, s2: null, winner: null, id: Math.random() });
                    }
                });

                while (secondPlaces.length > 0) {
                    const pA = secondPlaces.pop();
                    const pB = secondPlaces.length > 0 ? secondPlaces.pop() : { id: `empty-${pA.id}`, name: "", isEmpty: true };
                    initialMatches.push({ p1: pA, p2: pB, s1: null, s2: null, winner: null, id: Math.random() });
                }
            }

            const matchCount = initialMatches.length;
            const bracketSize = Math.pow(2, Math.ceil(Math.log2(matchCount)));
            while (initialMatches.length < bracketSize) {
                initialMatches.push({ p1: {name: ""}, p2: {name: ""}, s1: null, s2: null, winner: null, id: Math.random() });
            }

            const rounds = [];
            let rNames = [];
            if (bracketSize === 8) rNames = ['1/8 Finału', 'Ćwierćfinały', 'Półfinały', 'Finał'];
            else if (bracketSize === 4) rNames = ['Ćwierćfinały', 'Półfinały', 'Finał'];
            else if (bracketSize === 2) rNames = ['Półfinały', 'Finał'];
            else rNames = ['Finał'];

            rounds.push({ name: rNames[0] || 'Runda 1', matches: initialMatches });

            let nextRoundSize = initialMatches.length / 2;
            let rIdx = 1;
            while (nextRoundSize >= 1) {
                rounds.push({ 
                    name: rNames[rIdx] || 'Runda', 
                    matches: Array.from({ length: nextRoundSize }, () => ({ p1: {name: ""}, p2: {name: ""}, s1: null, s2: null, winner: null, id: Math.random() })) 
                });
                nextRoundSize /= 2;
                rIdx++;
            }

            bracketData = rounds;
            currentStatus = "Drabinka";
            updateHeader();
            renderBracket();
            saveData();
            switchTab('bracket');
        }

        function updateBracketScore(rIdx, mIdx, pNum, val) {
            const m = bracketData[rIdx].matches[mIdx];
            if (!m.p1.name && !m.p2.name) return;
            const v = val === "" ? null : parseInt(val);
            if (pNum === 1) m.s1 = v; else m.s2 = v;
            
            if (m.s1 !== null && m.s2 !== null) {
                m.winner = m.s1 > m.s2 ? m.p1 : m.p2;
                if (bracketData[rIdx+1]) {
                    const nextM = bracketData[rIdx+1].matches[Math.floor(mIdx/2)];
                    if (mIdx % 2 === 0) nextM.p1 = {...m.winner}; else nextM.p2 = {...m.winner};
                }
            }
            if (bracketData[rIdx].name === 'Finał' && m.winner) document.getElementById('finishTournamentContainer').classList.remove('hidden');
            renderBracket(); saveData();
        }

        function handleDragStart(rIdx, mIdx, pNum) {
            const player = bracketData[rIdx].matches[mIdx][pNum === 1 ? 'p1' : 'p2'];
            if (!player.name) return;
            draggedPlayer = {...player};
            dragSource = { rIdx, mIdx, pNum };
        }

        function handleDrop(rIdx, mIdx, pNum) {
            if (!draggedPlayer) return;
            const targetKey = pNum === 1 ? 'p1' : 'p2';
            const targetPlayer = {...bracketData[rIdx].matches[mIdx][targetKey]};
            
            bracketData[rIdx].matches[mIdx][targetKey] = draggedPlayer;
            bracketData[dragSource.rIdx].matches[dragSource.mIdx][dragSource.pNum === 1 ? 'p1' : 'p2'] = targetPlayer;
            
            bracketData[rIdx].matches[mIdx].s1 = null; bracketData[rIdx].matches[mIdx].s2 = null; bracketData[rIdx].matches[mIdx].winner = null;
            bracketData[dragSource.rIdx].matches[dragSource.mIdx].s1 = null; bracketData[dragSource.rIdx].matches[dragSource.mIdx].s2 = null; bracketData[dragSource.rIdx].matches[dragSource.mIdx].winner = null;

            draggedPlayer = null; dragSource = null;
            renderBracket(); saveData();
        }

        function renderBracket(targetId = "bracketContainer", data = bracketData) {
            const container = document.getElementById(targetId);
            if (!data || !data.length) return;
            container.innerHTML = data.map((round, rIdx) => `
                <div class="flex flex-col flex-1 gap-12 items-center">
                    <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest">${round.name}</h4>
                    <div class="flex flex-col h-full justify-around w-full gap-8">
                        ${round.matches.map((m, mIdx) => `
                            <div class="bento-card w-56 p-4 border ${m.winner ? 'border-indigo-500/40' : 'border-white/5'}">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="draggable-name text-xs truncate ${m.winner?.id === m.p1.id && m.p1.name !== "" ? 'text-indigo-400 font-bold' : 'text-slate-400'}" 
                                          draggable="${rIdx === 0}" 
                                          ondragstart="handleDragStart(${rIdx}, ${mIdx}, 1)"
                                          ondragover="event.preventDefault(); this.closest('.bento-card').classList.add('drop-zone-active')"
                                          ondragleave="this.closest('.bento-card').classList.remove('drop-zone-active')"
                                          ondrop="this.closest('.bento-card').classList.remove('drop-zone-active'); handleDrop(${rIdx}, ${mIdx}, 1)">
                                        ${m.p1.name}
                                    </span>
                                    <input type="number" value="${m.s1 !== null ? m.s1 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, 1, this.value)" 
                                           class="w-9 h-7 input-dart rounded text-center text-[10px] font-bold" ${targetId !== 'bracketContainer' || (!m.p1.name && !m.p2.name) ? 'disabled' : ''}>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="draggable-name text-xs truncate ${m.winner?.id === m.p2.id && m.p2.name !== "" ? 'text-indigo-400 font-bold' : 'text-slate-400'}"
                                          draggable="${rIdx === 0}" 
                                          ondragstart="handleDragStart(${rIdx}, ${mIdx}, 2)"
                                          ondragover="event.preventDefault(); this.closest('.bento-card').classList.add('drop-zone-active')"
                                          ondragleave="this.closest('.bento-card').classList.remove('drop-zone-active')"
                                          ondrop="this.closest('.bento-card').classList.remove('drop-zone-active'); handleDrop(${rIdx}, ${mIdx}, 2)">
                                        ${m.p2.name}
                                    </span>
                                    <input type="number" value="${m.s2 !== null ? m.s2 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, 2, this.value)" 
                                           class="w-9 h-7 input-dart rounded text-center text-[10px] font-bold" ${targetId !== 'bracketContainer' || (!m.p1.name && !m.p2.name) ? 'disabled' : ''}>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateScore(gId, mIdx, pNum, val) {
            const m = groups[gId].matches[mIdx];
            const v = val === "" ? null : parseInt(val);
            if (pNum === 1) m.s1 = v; else m.s2 = v;
            m.played = (m.s1 !== null && m.s2 !== null);
            renderGroups(); saveData();
        }

        function renderGroups(targetId = "groupsContainer", gData = groups) {
            const container = document.getElementById(targetId);
            if (!gData.length) { container.innerHTML = ""; return; }
            container.innerHTML = gData.map(g => {
                const st = calculateStandings(g);
                return `
                    <div class="bento-card p-6">
                        <h3 class="text-xl font-bold text-indigo-400 mb-4">${g.name}</h3>
                        <table class="w-full text-[11px] mb-4">
                            <tr class="text-slate-500 uppercase">
                                <th class="text-left py-2">Gracz</th>
                                <th class="text-center">M</th>
                                <th class="text-center">W</th>
                                <th class="text-center">B</th>
                                <th class="text-center">Pkt</th>
                            </tr>
                            ${st.map(p => `
                                <tr class="border-t border-white/5">
                                    <td class="py-2 font-bold">${p.name}</td>
                                    <td class="text-center">${p.m}</td>
                                    <td class="text-center">${p.w}</td>
                                    <td class="text-center ${p.bilans > 0 ? 'text-emerald-400' : p.bilans < 0 ? 'text-red-400' : ''}">${p.bilans > 0 ? '+' + p.bilans : p.bilans}</td>
                                    <td class="text-center text-white font-black">${p.pts}</td>
                                </tr>`).join('')}
                        </table>
                        <div class="space-y-2">
                            ${g.matches.map((m, idx) => `
                                <div class="flex items-center gap-2 bg-black/20 p-2 rounded-lg">
                                    <span class="flex-1 text-right text-xs truncate">${m.p1.name}</span>
                                    <input type="number" value="${m.s1 !== null ? m.s1 : ''}" onchange="updateScore(${g.id}, ${idx}, 1, this.value)" class="w-8 h-7 input-dart text-center rounded text-xs" ${targetId !== 'groupsContainer' ? 'disabled' : ''}>
                                    <span>:</span>
                                    <input type="number" value="${m.s2 !== null ? m.s2 : ''}" onchange="updateScore(${g.id}, ${idx}, 2, this.value)" class="w-8 h-7 input-dart text-center rounded text-xs" ${targetId !== 'groupsContainer' ? 'disabled' : ''}>
                                    <span class="flex-1 text-left text-xs truncate">${m.p2.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function archiveTournament() {
            const win = bracketData[bracketData.length-1].matches[0].winner;
            tournamentHistory.unshift({ id: Date.now(), name: tournamentName, date: new Date().toLocaleString(), winner: win ? win.name : "?", groups: JSON.parse(JSON.stringify(groups)), bracket: JSON.parse(JSON.stringify(bracketData)) });
            tournamentName = ""; players = []; groups = []; bracketData = []; currentStatus = "Konfiguracja";
            saveData(); location.reload();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (!tournamentHistory.length) { container.innerHTML = "<p class='col-span-full text-center text-slate-600'>Brak danych w archiwum</p>"; return; }
            container.innerHTML = tournamentHistory.map(t => `
                <div class="bento-card p-6 cursor-pointer hover:bg-white/5 relative" onclick="openArchive(${t.id})">
                    <span class="text-[10px] text-indigo-500 font-bold uppercase">${t.date}</span>
                    <h3 class="text-xl font-bold text-white truncate">${t.name}</h3>
                    <p class="text-sm text-slate-400 mt-2">Zwycięzca: <span class="text-amber-500 font-bold">${t.winner}</span></p>
                    <button onclick="event.stopPropagation(); deleteHistory(${t.id})" class="absolute top-4 right-4 text-red-500/50 hover:text-red-500">Usuń</button>
                </div>
            `).join('');
        }

        function deleteHistory(id) { if (confirm("Usunąć turniej z historii?")) { tournamentHistory = tournamentHistory.filter(h => h.id !== id); saveData(); renderHistory(); } }
        
        function openArchive(id) {
            const t = tournamentHistory.find(x => x.id === id); if (!t) return;
            document.getElementById('archiveTitle').innerText = t.name;
            document.getElementById('archiveDate').innerText = t.date;
            const content = document.getElementById('archiveContent');
            content.innerHTML = `<div id=\"arch-groups\" class=\"grid grid-cols-1 xl:grid-cols-2 gap-8\"></div><div id=\"arch-bracket\" class=\"flex justify-between py-12\"></div>`;
            renderGroups('arch-groups', t.groups); renderBracket('arch-bracket', t.bracket);
            document.getElementById('archiveOverlay').classList.remove('hidden');
        }

        function closeArchive() { document.getElementById('archiveOverlay').classList.add('hidden'); }
        function clearHistory() { if (confirm("Czy na pewno chcesz usunąć całą historię?")) { tournamentHistory = []; saveData(); renderHistory(); } }

        loadData();
    </script>
</body>
</html>
